const LAYOUT_LIST=[['modern','Modern'],['sutun','Sütun'],['baslik','Başlık'],['klasik','Klasik'],['minimal','Minimal'],['zaman','Zaman'],['kompakt','Kompakt'],['zarif','Zarif'],['vurgu','Vurgu'],['profil','Profil']];
const THEME_LIST=[['lacivert','Lacivert'],['bordo','Bordo'],['zumrut','Zümrüt'],['antrasit','Antrasit'],['altin','Altın']];
const TEMPLATES=[]; const TEMPLATES_MAP={};

const DEFAULT_TPL='modern-lacivert';

/* ====================== İÇERİK (Kariyer Rehberi — trafik & AdSense motoru) ====================== */
const ARTICLES=[
  {id:'7-bolum', read:'4 dk', title:"CV'nizde Mutlaka Bulunması Gereken 7 Bölüm", excerpt:"İyi bir CV'nin iskeletini oluşturan temel bölümleri ve her birini nasıl güçlendireceğinizi anlatıyoruz.",
   body:["İşe alım uzmanları bir CV'ye ortalama birkaç saniye bakar. Bu kısa sürede doğru bilgiyi doğru yerde görmek isterler. Bu yüzden her CV'de şu yedi bölüm net biçimde yer almalı: iletişim bilgileri, kısa profil özeti, iş deneyimi, eğitim, yetenekler, diller ve varsa sertifikalar.",
   "İletişim bilgilerinizi en üste koyun ve güncel tutun. Profil özeti, sizi iki üç cümlede anlatan vitrin niteliğindedir; en çarpıcı başarınızı buraya taşıyın. Deneyim bölümünde görev tanımı yerine somut sonuçlara odaklanın: 'raporlama yaptım' yerine 'raporlama süresini yarıya indirdim' gibi.",
   "Yetenekler bölümünü başvurduğunuz ilana göre özelleştirin. Genel ifadeler yerine ilanda geçen anahtar kelimeleri kullanmak, hem insan okuyucu hem de otomatik tarama sistemleri için fark yaratır."]},
  {id:'ozet-cumlesi', read:'3 dk', title:"İş Başvurusunda Öne Çıkaran Özet Cümlesi Nasıl Yazılır?", excerpt:"CV'nizin en tepesindeki birkaç cümle, görüşmeye çağrılmanızı belirleyebilir. İşte etkili bir özetin formülü.",
   body:["Profil özeti, kim olduğunuzu, ne yaptığınızı ve karşı tarafa ne katacağınızı anlatan kısa bir paragraftır. İdeal uzunluğu iki ile dört cümledir. Amaç merak uyandırmak, tüm hikâyeyi anlatmak değil.",
   "İyi bir özet üç parçadan oluşur: ünvanınız ve deneyim süreniz, en güçlü uzmanlık alanınız ve ölçülebilir bir başarı. Örneğin: 'Yedi yıllık deneyime sahip ürün tasarımcısı. Mobil deneyim optimizasyonunda uzman; son projesinde dönüşüm oranını üçte bir oranında artırdı.'",
   "Her başvuruda bu cümleyi ilana göre hafifçe yeniden yazın. Genel bir özet yerine pozisyona özel bir giriş, sizi diğer adaylardan ayırır."]},
  {id:'ats', read:'5 dk', title:"ATS Nedir? CV'niz Robot Filtrelerini Nasıl Geçer?", excerpt:"Başvurunuz bir insana ulaşmadan önce çoğu zaman bir yazılımdan geçer. Bu filtreyi geçmenin yolları.",
   body:["ATS (Aday Takip Sistemi), şirketlerin gelen başvuruları otomatik olarak tarayıp sıralayan yazılımlardır. Büyük şirketlerin çoğu bu sistemleri kullanır. CV'niz okunabilir ve anahtar kelime açısından uyumlu değilse, bir insana hiç ulaşmayabilir.",
   "Filtreyi geçmek için sade bir düzen kullanın: standart başlıklar, tek sütun ya da basit iki sütun, okunabilir yazı tipleri. Aşırı grafik, tablo içine gömülü metin ve görsel olarak metne dönüştürülmüş başlıklardan kaçının.",
   "İlandaki kelimeleri CV'nizde de kullanın. 'Proje yönetimi' aranıyorsa, bu ifadeyi birebir geçirin. Dürüst kalmak şartıyla, ilanın diliyle konuşmak görünürlüğünüzü artırır."]},
  {id:'fotograf', read:'3 dk', title:"Fotoğraflı CV mi, Fotoğrafsız CV mi?", excerpt:"Hangi durumda fotoğraf eklemeli, hangi durumda eklememeli? Ülke ve sektöre göre değişen kuralları açıklıyoruz.",
   body:["Fotoğraf kullanımı ülkeye ve sektöre göre değişir. Türkiye, Almanya gibi ülkelerde profesyonel bir vesikalık yaygın ve kabul görür. Buna karşılık ABD ve İngiltere'de önyargı riskini azaltmak için çoğu zaman fotoğraf istenmez.",
   "Fotoğraf ekleyecekseniz profesyonel görünmesine dikkat edin: sade arka plan, iyi ışık, kıyafetin pozisyona uygun olması. Tatil ya da sosyal medya kareleri uygun değildir.",
   "Yaratıcı sektörlerde ve müşteriyle yüz yüze çalışılan rollerde fotoğraf olumlu etki yaratabilir. Tereddütteyseniz, başvurduğunuz şirketin kültürüne ve ilandaki tona bakın."]},
  {id:'deneyimsiz', read:'4 dk', title:"Deneyimsizken Güçlü Bir CV Nasıl Hazırlanır?", excerpt:"Henüz iş deneyiminiz yoksa bile dikkat çeken bir CV oluşturmanın yolları var.",
   body:["İş deneyimi azsa, CV'nizin ağırlığını başka alanlara kaydırın: okul projeleri, gönüllü çalışmalar, stajlar, kişisel projeler ve kazandığınız beceriler. Bunlar da gerçek yetkinliklerdir.",
   "Öğrendiklerinizi sonuç odaklı anlatın. 'Bir kulüpte etkinlik düzenledim' yerine 'elli kişilik bir etkinliği baştan sona organize ettim' demek çok daha güçlüdür.",
   "Profil özetinizde hevesinizi ve öğrenme isteğinizi vurgulayın. İşverenler yeni mezunlarda mükemmel deneyim değil, potansiyel ve uyum arar."]},
  {id:'10-ipucu', read:'5 dk', title:"Mülakata Çağrılma Şansını Artıran 10 İpucu", excerpt:"Küçük dokunuşlarla CV'nizin geri dönüş oranını ciddi biçimde yükseltebilirsiniz.",
   body:["CV'nizi her başvuruda ilana göre uyarlayın, tek bir CV'yi her yere göndermeyin. İlanın başlığıyla CV'nizdeki ünvanı eşleştirin. Sonuçları rakamlarla destekleyin ve gereksiz bilgileri çıkarın.",
   "Tek sayfada kalmaya çalışın; çok deneyimli değilseniz iki sayfa gereksizdir. Yazım hatalarını mutlaka kontrol edin, çünkü tek bir hata bile özensiz izlenimi bırakabilir.",
   "Dosyayı PDF olarak gönderin ki düzen bozulmasın. Dosya adını da profesyonel yapın: 'cv_son_v2' yerine 'Ad-Soyad-CV' gibi. Son olarak, başvurmadan önce CV'nizi bir başkasına okutun."]},
  {id:'on-yazi', read:'4 dk', title:"Etkili Bir Ön Yazı (Cover Letter) Nasıl Yazılır?", excerpt:"CV'nizi tamamlayan ön yazı, doğru yazıldığında sizi diğer adaylardan ayırır.",
   body:["Ön yazı, CV'nizdeki bilgileri tekrarlamak için değil, neden tam da bu işe ve bu şirkete uygun olduğunuzu anlatmak için vardır. Üç paragraf yeterlidir: neden başvurduğunuz, ne katacağınız ve bir görüşme talebi.",
   "İlk cümlede dikkat çekin. 'Bu pozisyona başvuruyorum' yerine, şirketin sizi neden ilgilendirdiğini ya da en güçlü başarınızı öne çıkarın. Şirketi araştırdığınızı gösteren bir detay büyük fark yaratır.",
   "Kısa tutun; yarım sayfayı geçmeyin. Her başvuru için yeniden yazın, kopyala-yapıştır ön yazılar hemen belli olur ve olumsuz izlenim bırakır."]},
  {id:'linkedin', read:'4 dk', title:"LinkedIn Profilinizi CV'nizle Uyumlu Hale Getirme", excerpt:"İşverenler başvurunuzdan sonra çoğu zaman LinkedIn'inize bakar. İki profil tutarlı olmalı.",
   body:["İşe alım uzmanlarının büyük kısmı, CV'nizi gördükten sonra adınızı LinkedIn'de arar. Profilinizdeki ünvanlar, tarihler ve şirketler CV'nizle çelişiyorsa bu güven kaybına yol açar. İkisini düzenli olarak eşitleyin.",
   "Profil başlığınızı yalnızca ünvanla sınırlamayın; ne yaptığınızı ve uzmanlığınızı özetleyen bir cümle kullanın. 'Hakkında' bölümünü CV özetinizin biraz daha kişisel bir versiyonu olarak yazın.",
   "İyi bir profil fotoğrafı ve özelleştirilmiş bir URL profesyonellik katar. Bağlantılarınızdan ve eski yöneticilerinizden gelen tavsiyeler de güçlü sosyal kanıttır."]},
  {id:'beceriler', read:'4 dk', title:"CV'de Hangi Beceriler Yazılmalı? Teknik ve Kişisel Beceriler", excerpt:"Beceriler bölümü, doğru kurgulandığında hem insan okuyucu hem de filtre sistemleri için etkilidir.",
   body:["Beceriler iki gruba ayrılır: teknik (sert) beceriler ölçülebilir yetkinliklerdir; yazılım dilleri, programlar, sertifikalar gibi. Kişisel (yumuşak) beceriler ise iletişim, takım çalışması, problem çözme gibi davranışsal yetkinliklerdir.",
   "Yalnızca kişisel beceri listelemek zayıf kalır çünkü herkes 'takım oyuncusu' yazar. Bunları somut örneklerle deneyim bölümünde kanıtlayın. Teknik becerileri ise net ve ilana uygun biçimde listeleyin.",
   "Sahip olmadığınız beceriyi yazmayın; mülakatta kolayca açığa çıkar. Bunun yerine öğrenmekte olduğunuz becerileri 'temel seviye' gibi dürüst ifadelerle belirtebilirsiniz."]},
  {id:'star', read:'5 dk', title:"Deneyimi Sonuç Odaklı Yazmanın Formülü: STAR Yöntemi", excerpt:"Görev tanımı yazmak yerine başarılarınızı anlatın. STAR yöntemi bunu kolaylaştırır.",
   body:["STAR; Durum (Situation), Görev (Task), Eylem (Action) ve Sonuç (Result) kelimelerinin kısaltmasıdır. Her deneyim maddesini bu yapıyla düşünmek, sıradan görev tanımlarını etkileyici başarı cümlelerine dönüştürür.",
   "Örneğin 'müşteri hizmetlerinde çalıştım' yerine: 'artan şikayetleri azaltmak için (durum/görev) yeni bir yanıt akışı kurdum (eylem) ve çözüm süresini yüzde kırk kısalttım (sonuç).' Bu cümle çok daha güçlüdür.",
   "Mümkün olduğunda rakam kullanın: yüzde, tutar, süre, kişi sayısı. Sayılar başarınızı somutlaştırır ve okuyanın gözünde kalır."]},
  {id:'hatalar', read:'4 dk', title:"CV'de Yapılan En Yaygın 12 Hata", excerpt:"Çoğu başvuru, küçük ama tekrarlayan hatalar yüzünden elenir. İşte kaçınmanız gerekenler.",
   body:["En sık görülen hatalar; yazım yanlışları, herkese aynı CV'yi göndermek, sonuç yerine görev listelemek, gereğinden uzun metinler ve okunması zor tasarımlardır. Bunların her biri kolayca düzeltilebilir.",
   "Diğer yaygın hatalar arasında güncel olmayan iletişim bilgileri, profesyonel olmayan e-posta adresleri, anlamsız klişeler ve ilanla alakasız deneyimlere fazla yer vermek bulunur.",
   "Son olarak; fotoğrafın uygunsuz olması, dosyanın Word yerine bozulabilen formatta gönderilmesi ve yalan bilgi eklemek ciddi hatalardır. CV'nizi göndermeden önce bir kontrol listesinden geçirin."]},
  {id:'kariyer-boslugu', read:'4 dk', title:"Kariyer Boşluklarını (Gap) CV'de Nasıl Açıklarsınız?", excerpt:"İş hayatındaki aralar normaldir. Önemli olan bunları doğru çerçevede sunmaktır.",
   body:["Kariyer boşlukları; eğitim, sağlık, ailevi nedenler ya da iş arama süreci yüzünden olabilir. Bunları gizlemeye çalışmak yerine kısa ve dürüst bir açıklama eklemek daha güçlü bir izlenim bırakır.",
   "Boşluk döneminde bir şey öğrendiyseniz, gönüllü çalıştıysanız veya bir sertifika aldıysanız bunu mutlaka belirtin. Bu, sürekli gelişime açık olduğunuzu gösterir.",

function initials(name){ name=(name||'').trim(); if(!name) return 'CV'; const p=name.split(/\s+/); return (((p[0]||'')[0]||'')+((p[1]||'')[0]||'')).toUpperCase(); }
function avatar(name,bg,fg){
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><rect width='120' height='120' fill='${bg}'/><circle cx='60' cy='47' r='21' fill='${fg}'/><path d='M24 104 c0 -22 16 -34 36 -34 s36 12 36 34 z' fill='${fg}'/></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function photoEl(P,C,size,o){ o=o||{};
  const src = P.d.photo ? P.d.photo : avatar(P.d.fullName, o.darkBg?'#ffffff':C.accent, o.darkBg?C.accent:'#ffffff');
  const ring = o.ring?`box-shadow:0 0 0 3px ${o.ring};`:'';
  return `<div style="width:${size}px;height:${size}px;border-radius:${o.square?'12px':'50%'};overflow:hidden;flex:0 0 auto;background:#fff;${ring}"><img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
}

function hexLighten(hex,amt){ // amt 0..1 (beyaza yaklaştır)
  try{ hex=hex.replace('#',''); if(hex.length===3) hex=hex.split('').map(x=>x+x).join('');
    const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    const m=v=>Math.round(v+(255-v)*amt); return `rgb(${m(r)},${m(g)},${m(b)})`;
  }catch(e){ return '#eef0f3'; }
}

function renderCV(id, d){
  const t = TEMPLATES_MAP[id] || TEMPLATES[0];
  const C = colors(t.theme);
  if(d.accent){ C.accent=d.accent; C.soft=hexLighten(d.accent,.9); }
  const has=v=>v&&(''+v).trim();
  const P={ d, has,
    cont:[d.email,d.phone,d.location,d.website,d.linkedin,
      d.birthDate&&('Doğum: '+d.birthDate), d.nationality&&('Uyruk: '+d.nationality),
      d.maritalStatus&&('Medeni durum: '+d.maritalStatus), d.military&&('Askerlik: '+d.military),
      d.driverLicense&&('Ehliyet: '+d.driverLicense)].filter(has),
    exps:(d.experience||[]).filter(e=>has(e.role)||has(e.company)),
    edus:(d.education||[]).filter(e=>has(e.school)),
    projs:(d.projects||[]).filter(p=>has(p.name)),
    certs:(d.certificates||[]).filter(c=>has(c.name)),
    skills:(d.skills||'').split(',').map(s=>s.trim()).filter(Boolean) };
  return (LAYOUTS[t.layout]||LAYOUTS.modern)(P,C);
}

function thumb(t, onclick, selectable){
  const sel = selectable && S.active && S.active.template===t.id;
  return `<div class="thumb" onclick="${onclick}">
    <div class="thumbBox" style="border:${sel?'2.5px solid var(--gold)':'1px solid var(--line)'}"><div class="thumbInner">${renderCV(t.id,SAMPLE_MINI)}</div></div>
    <div style="font-size:11px;text-align:center;margin-top:6px;color:#5a5346;font-weight:${sel?'700':'500'}">${t.name}</div>
  </div>`;
}

function toggleMode(){ authMode = authMode==='signup'?'login':'signup'; rerender(); }
function submitAuth(){
  const nameEl=document.getElementById('f_name');
  const name=nameEl?nameEl.value:'';
  const email=(document.getElementById('f_email').value||'').toLowerCase();
  const pass=document.getElementById('f_pass').value||'';
  const err=document.getElementById('authErr');
  if(!email||!pass){err.textContent='E-posta ve şifre zorunludur.';return;}
  if(authMode==='signup'){
    if(!name){err.textContent='Lütfen adınızı girin.';return;}
    if(S.users[email]){err.textContent='Bu e-posta zaten kayıtlı. Giriş yapın.';return;}
    S.users[email]={name,email,pass}; S.user={name,email};
  }else{
    const u=S.users[email];
    if(!u||u.pass!==pass){err.textContent='E-posta veya şifre hatalı.';return;}
    S.user={name:u.name,email:u.email};
  }
  go('dashboard');
}

        <div style="display:flex;gap:10px"><div style="margin-bottom:11px;flex:1"><label class="label">Konum</label><input class="inp" ${F('contact')} value="${esc(d.location)}" oninput="updField('location',this.value)"></div><div style="margin-bottom:11px;flex:1"><label class="label">Web / Portfolyo</label><input class="inp" ${F('contact')} value="${esc(d.website)}" oninput="updField('website',this.value)"></div></div>
        <div style="margin-bottom:11px"><label class="label">LinkedIn</label><input class="inp" ${F('contact')} value="${esc(d.linkedin)}" oninput="updField('linkedin',this.value)" placeholder="linkedin.com/in/kullanici"></div>
        <details style="margin-bottom:11px"><summary style="cursor:pointer;font-size:12.5px;color:#8a6d1f;font-weight:700;margin-bottom:6px">+ Ek kişisel bilgiler (isteğe bağlı)</summary>

          <div style="display:flex;gap:10px"><div style="flex:1;margin-bottom:11px"><label class="label">Medeni Durum</label><input class="inp" ${F('contact')} value="${esc(d.maritalStatus)}" oninput="updField('maritalStatus',this.value)" placeholder="Bekâr / Evli"></div><div style="flex:1;margin-bottom:11px"><label class="label">Ehliyet</label><input class="inp" ${F('contact')} value="${esc(d.driverLicense)}" oninput="updField('driverLicense',this.value)" placeholder="B"></div></div>
          <div style="margin-bottom:4px"><label class="label">Askerlik Durumu</label><input class="inp" ${F('contact')} value="${esc(d.military)}" oninput="updField('military',this.value)" placeholder="Yapıldı / Tecilli / Muaf"></div>
        </details>
        <div style="margin-bottom:11px"><label class="label">Hakkımda / Özet</label><textarea class="inp" ${F('summary')} oninput="updField('summary',this.value)" placeholder="Kendinizi 2-3 cümleyle özetleyin.">${esc(d.summary)}</textarea></div>
        <div style="height:1px;background:var(--line);margin:18px 0"></div>
        <h3 style="font-family:var(--serif);font-size:16px;margin-bottom:10px">İş Deneyimi</h3>${expRows}
        <button style="border:1.5px dashed var(--gold);color:#8a6d1f;background:none;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600" onclick="addRow('experience')">+ Deneyim Ekle</button>
        <div style="height:1px;background:var(--line);margin:18px 0"></div>
        <h3 style="font-family:var(--serif);font-size:16px;margin-bottom:10px">Eğitim</h3>${eduRows}
        <button style="border:1.5px dashed var(--gold);color:#8a6d1f;background:none;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600" onclick="addRow('education')">+ Eğitim Ekle</button>
        <div style="height:1px;background:var(--line);margin:18px 0"></div>
        <h3 style="font-family:var(--serif);font-size:16px;margin-bottom:10px">Projeler</h3>${projRows}
        <button style="border:1.5px dashed var(--gold);color:#8a6d1f;background:none;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600" onclick="addRow('projects')">+ Proje Ekle</button>
        <div style="height:1px;background:var(--line);margin:18px 0"></div>

        <div style="margin-bottom:11px"><label class="label">Diller</label><input class="inp" value="${esc(d.languages)}" ${F('languages')} oninput="updField('languages',this.value)" placeholder="Türkçe (Ana dil), İngilizce (İleri)"></div>

      <div class="stick" style="flex:1 1 420px;min-width:300px;position:sticky;top:72px">

          <span style="margin-left:auto;display:flex;align-items:center;gap:4px">
            <button onclick="zoomBy(-0.1)" style="border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:26px;font-size:15px;cursor:pointer">−</button>
            <button onclick="zoomReset()" style="border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 8px;height:26px;font-size:11px;cursor:pointer">%${Math.round((S.zoom||1)*100)}</button>
            <button onclick="zoomBy(0.1)" style="border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:26px;font-size:15px;cursor:pointer">+</button>
          </span>
          ${c.paid?'':`<span style="color:#8a6d1f;font-weight:600;margin-left:8px;font-size:11px">${price} TL · dışa aktarımda</span>`}
        </div>
        <div style="position:relative;overflow:auto"><div id="zoomWrap" style="transform:scale(${S.zoom||1});transform-origin:top center"><div class="a4" id="printArea">${renderCV(c.template,d)}</div></div>
        ${c.paid?'':`<div style="position:absolute;bottom:0;left:0;right:0;height:90px;background:linear-gradient(transparent,rgba(255,255,255,.96));display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px"><button class="gold" onclick="download()">⤓ Dışa Aktar</button></div>`}</div>
      </div>
    </div>
  </div>`;
}

/* ====================== ŞABLON SEÇİCİ (50) ====================== */
function tplFilterChips(){ const fams=[['all','Tümü']].concat(LAYOUT_LIST); return fams.map(f=>`<button onclick="filterTpl('${f[0]}')" style="padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;${S.tplFilter===f[0]?'background:var(--ink);color:#fff':'background:var(--cream);color:#6b6354;border:1px solid var(--line)'}">${f[1]}</button>`).join(''); }
function tplGridHTML(){ const list = S.tplFilter==='all'?TEMPLATES:TEMPLATES.filter(t=>t.layout===S.tplFilter); return list.map(t=>thumb(t,`pickTemplate('${t.id}')`,true)).join(''); }
function openTplPicker(){
  document.getElementById('app').insertAdjacentHTML('beforeend',`<div id="tplPicker" style="position:fixed;inset:0;background:rgba(10,12,24,.65);backdrop-filter:blur(4px);z-index:120;display:flex;padding:14px">
    <div style="background:#fff;margin:auto;width:100%;max-width:900px;max-height:92vh;border-radius:18px;overflow:hidden;display:flex;flex-direction:column">
      <div style="padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><div style="font-family:var(--serif);font-size:18px;font-weight:600">Şablon Seç <span style="font-size:12px;color:#998;font-weight:400">(50 şablon)</span></div><button onclick="closeTplPicker()" style="background:none;font-size:20px">✕</button></div>
      <div id="tplFilters" style="padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)">${tplFilterChips()}</div>
      <div id="tplGrid" style="padding:18px 16px;overflow:auto;display:flex;flex-wrap:wrap;gap:14px;justify-content:center">${tplGridHTML()}</div>
    </div></div>`);
}
function closeTplPicker(){ const m=document.getElementById('tplPicker'); if(m)m.remove(); }
function filterTpl(k){ S.tplFilter=k; const g=document.getElementById('tplGrid'); if(g)g.innerHTML=tplGridHTML(); const f=document.getElementById('tplFilters'); if(f)f.innerHTML=tplFilterChips(); }
function pickTemplate(id){ if(S.active) S.active.template=id; closeTplPicker(); rerender(); }

/* ====================== ÖDEME ====================== */
function paymentModal(){
  const price=nextPrice();
  return `<div id="payModal" style="position:fixed;inset:0;background:rgba(10,12,24,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px">
    <div style="background:#fff;border-radius:18px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)">
      <div style="background:var(--ink);padding:20px 22px;color:#fff;position:relative">
        <button onclick="closePay()" style="position:absolute;right:14px;top:14px;background:none;color:#fff;font-size:18px">✕</button>
        <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#bbb">🛡 Güvenli Ödeme</div>
        <div style="font-family:var(--serif);font-size:27px;font-weight:600;margin-top:6px">${price} TL</div>
        <div style="font-size:12px;color:#cfcfd8">${paidCount()===0?"İlk CV'niz — özel başlangıç fiyatı":'CV indirme ve PDF dışa aktarma'}</div>
      </div>
      <div id="payBody" style="padding:22px">
        <div style="background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px"><span style="color:#6b6354">${S.active&&TEMPLATES_MAP[S.active.template]?TEMPLATES_MAP[S.active.template].name:'CV'} · PDF (A4)</span><b style="color:var(--ink)">${price} TL</b></div>
        <div style="margin-bottom:12px"><label class="label">💳 Kart Numarası</label><input class="inp" placeholder="0000 0000 0000 0000" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim()"></div>
        <div style="margin-bottom:12px"><label class="label">Kart Üzerindeki İsim</label><input class="inp" placeholder="AD SOYAD"></div>
        <div style="display:flex;gap:12px"><div style="flex:1;margin-bottom:12px"><label class="label">Son Kullanma</label><input class="inp" placeholder="AA/YY"></div><div style="flex:1;margin-bottom:12px"><label class="label">CVV</label><input class="inp" placeholder="123"></div></div>
        <button class="gold" style="width:100%;justify-content:center;margin-top:6px" onclick="processPay()">🔒 ${price} TL Öde</button>
        <div style="font-size:10.5px;color:#999;text-align:center;margin-top:12px;line-height:1.5">Bu bir <b>demo</b> ödeme ekranıdır. Gerçek tahsilat yapılmaz.<br>Canlıda iyzico ile entegre edilir.</div>
      </div>
    </div>
  </div>`;
}

/* ====================== AKSİYONLAR ====================== */
function go(v){ S.view=v; render(true); }
function openArticle(id){ S.articleId=id; go('article'); }
function openLegal(k){ S.legalKey=k; go('legal'); }
function closeAnchor(){ S.hideAnchor=true; const a=document.getElementById('anchorAd'); if(a)a.remove(); }
function acceptCookies(){ S.cookieConsent='accepted'; rerender(); }
function rejectCookies(){ S.cookieConsent='rejected'; rerender(); }
function setMeta(){
  const A=ARTICLES_MAP[S.articleId], L=LEGAL[S.legalKey];
  const M={ landing:['CVUsta — Ücretsiz Online CV Oluşturucu | 50+ Şablon','Dakikalar içinde profesyonel, fotoğraflı CV oluştur. 50+ şablon, canlı önizleme ve PDF indirme.'],
    guide:['Kariyer Rehberi — CV ve İş Arama İpuçları | CVUsta','CV yazımı, mülakat ve iş arama üzerine ücretsiz, pratik rehber yazıları.'],
    article:[A?A.title+' | CVUsta':'Kariyer Rehberi | CVUsta', A?A.excerpt:''],
    legal:[L?L.title+' | CVUsta':'CVUsta', 'CVUsta yasal bilgilendirme sayfası.'],
    auth:['Giriş / Kayıt | CVUsta','CVUsta hesabına giriş yap veya ücretsiz kayıt ol.'],
    dashboard:['Panelim | CVUsta','CV\'lerini yönet ve yenisini oluştur.'],
    editor:['CV Düzenleyici | CVUsta','CV\'ni düzenle, şablon seç ve PDF olarak indir.'] };
  const m=M[S.view]||M.landing;
  try{
    document.title=m[0];
    const set=(id,val)=>{ const el=document.getElementById(id); if(el)el.setAttribute('content',val); };
    set('metaDesc',m[1]); set('ogTitle',m[0]); set('ogDesc',m[1]); set('twTitle',m[0]); set('twDesc',m[1]);
    const ld=document.getElementById('ldjson');
    if(ld){ ld.textContent = (S.view==='article'&&A)
      ? JSON.stringify({"@context":"https://schema.org","@type":"Article",headline:A.title,description:A.excerpt,author:{"@type":"Organization",name:"CVUsta"},publisher:{"@type":"Organization",name:"CVUsta"}})
      : JSON.stringify({"@context":"https://schema.org","@type":"WebSite",name:"CVUsta"}); }
  }catch(e){}
}
function onPhoto(input){ const f=input.files&&input.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ S.active.data.photo=r.result; rerender(); }; r.readAsDataURL(f); }
function removePhoto(){ S.active.data.photo=""; rerender(); }
function toggleAll(){ S.showAll=true; rerender(); }
function logout(){ S.user=null; S.cvs=[]; S.active=null; go('landing'); }
function newCV(){ S.active={id:uid(),template:DEFAULT_TPL,paid:false,data:emptyData()}; S.cvs.unshift(S.active); go('editor'); }
function startWith(id){ S.active={id:uid(),template:id,paid:false,data:emptyData()}; S.cvs.unshift(S.active); go('editor'); }
function openCV(id){ S.active=S.cvs.find(c=>c.id===id); go('editor'); }
function delCV(id){ S.cvs=S.cvs.filter(c=>c.id!==id); if(S.active&&S.active.id===id)S.active=null; rerender(); }
function updField(k,v){ S.active.data[k]=v; livePreview(); }
function upd(sec,i,k,v){ S.active.data[sec][i][k]=v; livePreview(); }
function addRow(sec){ const B={experience:{role:"",company:"",period:"",desc:""},education:{school:"",degree:"",period:""},projects:{name:"",desc:""},certificates:{name:"",issuer:"",year:""}}; S.active.data[sec].push(B[sec]||{}); rerender(); }
function delRow(sec,i){ S.active.data[sec].splice(i,1); rerender(); }
function moveRow(sec,i,dir){ const a=S.active.data[sec]; const j=i+dir; if(j<0||j>=a.length) return; const t=a[i]; a[i]=a[j]; a[j]=t; rerender(); }
function rowCtrls(sec,i,len){
  const ar=(lbl,dir,on)=>`<button ${on?'':'disabled'} onclick="${on?"moveRow('"+sec+"',"+i+","+dir+")":''}" style="background:#fff;border:1px solid ${on?'var(--line)':'#f1ecdf'};border-radius:6px;width:28px;height:26px;font-size:12px;cursor:${on?'pointer':'default'};color:${on?'#6b6354':'#d8d0bf'}">${lbl}</button>`;
  return `<div style="display:flex;align-items:center;gap:5px;margin-top:8px">${ar('↑',-1,i>0)}${ar('↓',1,i<len-1)}<button onclick="delRow('${sec}',${i})" style="background:none;border:none;color:#c0392b;font-size:11.5px;cursor:pointer;margin-left:auto">🗑 Sil</button></div>`;
}
function zoomBy(d){ S.zoom=Math.min(1.8,Math.max(0.6,Math.round(((S.zoom||1)+d)*10)/10)); rerender(); }
function zoomReset(){ S.zoom=1; rerender(); }
function shareUrl(){ try{ return window.location.href; }catch(e){ return ''; } }
function shareTo(net){ const u=encodeURIComponent(shareUrl()); const a=ARTICLES_MAP[S.articleId]; const t=encodeURIComponent(a?a.title:'CVUsta'); let url='';
  if(net==='x') url='https://twitter.com/intent/tweet?text='+t+'&url='+u;
  else if(net==='linkedin') url='https://www.linkedin.com/sharing/share-offsite/?url='+u;
  else if(net==='whatsapp') url='https://wa.me/?text='+t+'%20'+u;
  try{ window.open(url,'_blank'); }catch(e){} }
function copyLink(){ const v=shareUrl(); try{ if(navigator.clipboard) navigator.clipboard.writeText(v); toast('Bağlantı kopyalandı'); }catch(e){ toast('Bağlantı kopyalandı'); } }
function updateReadBar(){ try{ const b=document.getElementById('readBar'); if(!b) return; const h=document.documentElement.scrollHeight-window.innerHeight; const sc=window.scrollY||window.pageYOffset||0; b.style.width=(h>0?Math.min(100,sc/h*100):0)+'%'; }catch(e){} }
function livePreview(){ const el=document.getElementById('printArea'); if(el)el.innerHTML=renderCV(S.active.template,S.active.data);
  const s=cvScore(S.active.data); const f=document.getElementById('scoreFill'); if(f)f.style.width=s+'%'; const p=document.getElementById('scorePct'); if(p)p.textContent='%'+s; }
function cvScore(d){ let pts=0; const total=8;
  if(d.fullName&&d.fullName.trim())pts++; if(d.title&&d.title.trim())pts++; if((d.email&&d.email.trim())||(d.phone&&d.phone.trim()))pts++; if(d.summary&&d.summary.trim())pts++;
  if((d.experience||[]).some(e=>e.role||e.company))pts++; if((d.education||[]).some(e=>e.school))pts++;
  if(d.skills&&d.skills.trim())pts++;
  if((d.projects||[]).some(p=>p.name)||(d.certificates||[]).some(c=>c.name)||(d.languages&&d.languages.trim()))pts++;
  return Math.round(pts/total*100); }
function setAccent(hex){ S.active.data.accent=hex; rerender(); }
function fillSample(){ S.active.data=JSON.parse(JSON.stringify(SAMPLE)); S.active.data.accent=''; rerender(); toast('Örnek bilgiler dolduruldu'); }
function clearCV(){ S.active.data=emptyData(); rerender(); toast('Form temizlendi'); }
function toast(msg){ try{ const t=document.createElement('div'); t.textContent=msg; t.style.cssText='position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#15182b;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .2s'; document.body.appendChild(t); requestAnimationFrame(()=>t.style.opacity='1'); setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),250); },1800);}catch(e){} }
function download(){ if(S.active.paid){window.print();return;} document.getElementById('app').insertAdjacentHTML('beforeend',paymentModal()); }
function closePay(){ const m=document.getElementById('payModal'); if(m)m.remove(); }
function processPay(){
  const body=document.getElementById('payBody');
  body.innerHTML='<div style="padding:40px 0;text-align:center"><div class="spin"></div><div style="font-size:14px;color:#555">Ödeme işleniyor…</div></div>';
  setTimeout(()=>{
    const acc = S.user ? '' : '<div style="font-size:11.5px;color:#998;margin-top:14px;line-height:1.5">İsteğe bağlı: <span onclick="closePay();go(\'auth\')" style="color:#8a6d1f;font-weight:700;cursor:pointer;text-decoration:underline">hesap oluşturup</span> CV\'lerinizi kaydedebilirsiniz.</div>';
    body.innerHTML='<div style="padding:36px 22px 30px;text-align:center"><div style="width:54px;height:54px;border-radius:50%;background:#e7f6ec;color:#1f9d55;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px">✓</div><div style="font-family:var(--serif);font-size:20px;font-weight:600">Ödeme Başarılı</div><div style="font-size:13px;color:#777;margin-top:4px">CV\u2019niz indirmeye hazır.</div>'+acc+'</div>';
    S.active.paid=true;
    setTimeout(()=>{ closePay(); rerender(); setTimeout(()=>{ if(S.view==='editor') window.print(); },300); },1100);
  },1500);
}

/* ====================== RENDER ====================== */
function viewHTML(){
  const v=S.view;
  return v==='landing'?landing(): v==='guide'?guide(): v==='article'?article(): v==='legal'?legalPage(): v==='auth'?auth(): v==='dashboard'?dashboard(): v==='editor'?editor(): landing();
}
function render(top){
  document.getElementById('app').innerHTML = viewHTML();
  setMeta();
  if(['landing','guide','article','legal'].indexOf(S.view)>=0 && S.cookieConsent===null){
    document.getElementById('app').insertAdjacentHTML('beforeend', cookieBanner());
  }
  try{ window.onscroll = (S.view==='article') ? updateReadBar : null; }catch(e){}
  if(top) window.scrollTo(0,0);
  updateReadBar();
}
function rerender(){ const y=window.scrollY||window.pageYOffset||0; render(false); window.scrollTo(0,y); }

(function(){
  try{
    var h=(location.hash||'').replace(/^#/,'');
    var legal=['gizlilik','mesafeli','iade','hakkimizda','iletisim'];
    if(h==='olustur'){ newCV(); return; }
    if(legal.indexOf(h)>=0){ S.legalKey=h; S.view='legal'; render(true); return; }
  }catch(e){}
  render(true);
})();
</script>
</body>
